name: Collect travel times

on:
  schedule:
    # Covers 6am-6pm Australia/Brisbane (UTC+10, no DST) with margin:
    # 20:00-23:59 UTC = 6:00am-9:59am Brisbane (next day), 00:00-08:10 UTC = 10:00am-6:10pm Brisbane.
    - cron: '*/10 20-23 * * *'
    - cron: '*/10 0-8 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass the weekday/time-window gate (for testing)'
        required: false
        default: 'false'
        type: boolean
      debug:
        description: 'Dump scraped page text to the run log (echoes input street names - off by default)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

concurrency:
  group: collect-travel-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check collection window
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force == true && 'true' || 'false' }}
        run: node scripts/gate.mjs

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.gate.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run collector
        if: steps.gate.outputs.should_run == 'true'
        env:
          FORCE_RUN: ${{ inputs.force == true && 'true' || 'false' }}
          DEBUG_DUMP_PAGE_TEXT: ${{ inputs.debug == true && 'true' || 'false' }}
          ORIGIN_ADDRESS: ${{ secrets.ORIGIN_ADDRESS }}
          DEST_ADDRESS: ${{ secrets.DEST_ADDRESS }}
          DEST_ADDRESS_2: ${{ secrets.DEST_ADDRESS_2 }}
          DEST_ADDRESS_3: ${{ secrets.DEST_ADDRESS_3 }}
          DEST_ADDRESS_4: ${{ secrets.DEST_ADDRESS_4 }}
        run: npm run collect

      - name: Commit and push new data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/readings.json
          if git diff --cached --quiet; then
            echo "No new data to commit."
          else
            git commit -m "Add travel time reading(s) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for attempt in 1 2 3 4; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
              echo "Push attempt $attempt failed, retrying..."
              sleep $((attempt * 3))
            done
          fi
